name: Release

# Every push to main runs the tests, then semantic-release reads the Conventional Commits
# since the last v* tag. feat → minor, fix/perf → patch, feat!/BREAKING CHANGE → major;
# other types (docs, chore, ci, ...) don't release.
on:
  push:
    branches: [main]
  # Manual runs do a dry run: they report the next version without tagging or publishing.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test
        run: make test

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && '--dry-run' || '' }}
        run: |
          npx --yes \
            -p semantic-release@25.0.9 \
            -p @semantic-release/exec@7.1.0 \
            -p conventional-changelog-conventionalcommits@10.4.1 \
            semantic-release $DRY_RUN
