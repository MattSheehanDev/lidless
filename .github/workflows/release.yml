name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs test and package the app as a workflow artifact without publishing a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: make test

      - name: Package
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ./scripts/package.sh "$VERSION"
          lipo -archs build/Lidless.app/Contents/MacOS/Lidless
          codesign --verify --deep --strict build/Lidless.app

      - uses: actions/upload-artifact@v4
        with:
          name: Lidless-${{ env.VERSION }}
          path: build/Lidless.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Lidless.zip \
            --title "Lidless ${VERSION}" \
            --notes-file build/release-notes.md \
            --generate-notes
